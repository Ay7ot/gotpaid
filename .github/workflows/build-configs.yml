name: build-configs
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: Build-config clean-file guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-build-configs.mjs
